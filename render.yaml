services:
  - type: web
    name: medigraph-api
    env: python
    buildCommand: "cd graphrag-benchmark && pip install -r requirements.txt"
    startCommand: "cd graphrag-benchmark && uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
